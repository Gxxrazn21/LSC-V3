<script src="58fc3380-a73b-4dab-b624-6208ea553b64" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="c486b079-1136-4cb0-a0d2-a206e838bd6c" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="66c093bc-b760-491d-86d4-8934c7d5f188" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="8ba6a9e7-cc24-4ca5-88ea-d9d52479f5c5"></script>
<script type="text/babel" src="9c2f3478-ca4f-4447-884a-c38704610949"></script>
<script type="text/babel" src="29906fb0-fab5-4697-b63f-acdbe83dde88"></script>
<script type="text/babel" src="6151a4c3-56b6-4b3a-9386-f18f50eec1cc"></script>
<script type="text/babel" src="60536a62-c9a0-471f-af7f-5c199b47f4d9"></script>

<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "default",
  "fontScale": "normal",
  "captions": true,
  "offline": true,
  "vibration": true,
  "startScreen": "home"
}/*EDITMODE-END*/;

function App() {
  const [themeKey, setThemeKey] = React.useState(TWEAK_DEFAULTS.theme);
  const [fontScale, setFontScale] = React.useState(TWEAK_DEFAULTS.fontScale);
  const [captions, setCaptions] = React.useState(TWEAK_DEFAULTS.captions);
  const [offline, setOffline] = React.useState(TWEAK_DEFAULTS.offline);
  const [vibration, setVibration] = React.useState(TWEAK_DEFAULTS.vibration);
  const [screen, setScreen] = React.useState(
    localStorage.getItem('sena_android_screen') || TWEAK_DEFAULTS.startScreen
  );
  const [showTweaks, setShowTweaks] = React.useState(false);
  const [tweaksEnabled, setTweaksEnabled] = React.useState(false);

  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') { setTweaksEnabled(true); setShowTweaks(true); }
      if (e.data?.type === '__deactivate_edit_mode') { setTweaksEnabled(false); setShowTweaks(false); }
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const theme = SENA_M3_THEMES[themeKey] || SENA_M3_THEMES.default;
  const fs = { normal: 1, large: 1.15, xlarge: 1.3 }[fontScale] || 1;

  const goTo = (s) => {
    setScreen(s);
    localStorage.setItem('sena_android_screen', s);
  };
  const persist = (key, val) => {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  };

  const navTabFor = (s) =>
    ['home','sign-to-text','text-to-sign','conversation'].includes(s) ? 'home'
    : s === 'dict' ? 'dict'
    : s === 'learn' ? 'learn'
    : s === 'history' ? 'history'
    : s === 'settings' ? 'settings' : 'home';

  const renderScreen = () => {
    switch (screen) {
      case 'home':          return <MdHomeScreen theme={theme} goTo={goTo} isOffline={offline}/>;
      case 'sign-to-text':  return <MdSignToTextScreen theme={theme} goTo={goTo}/>;
      case 'text-to-sign':  return <MdTextToSignScreen theme={theme} goTo={goTo}/>;
      case 'conversation':  return <MdConversationScreen theme={theme} goTo={goTo}/>;
      case 'dict':          return <MdDictionaryScreen theme={theme} goTo={goTo}/>;
      case 'learn':         return <MdLearnScreen theme={theme} goTo={goTo}/>;
      case 'history':       return <MdHistoryScreen theme={theme} goTo={goTo}/>;
      case 'settings':      return <MdSettingsScreen
                                      theme={theme} themeKey={themeKey}
                                      setThemeKey={(v) => { setThemeKey(v); persist('theme', v); }}
                                      fontScale={fontScale}
                                      setFontScale={(v) => { setFontScale(v); persist('fontScale', v); }}
                                      captions={captions}
                                      setCaptions={(v) => { setCaptions(v); persist('captions', v); }}
                                      offline={offline}
                                      setOffline={(v) => { setOffline(v); persist('offline', v); }}
                                      vibration={vibration}
                                      setVibration={(v) => { setVibration(v); persist('vibration', v); }}
                                      goTo={goTo}/>;
      default:              return <MdHomeScreen theme={theme} goTo={goTo}/>;
    }
  };

  const isImmersive = ['sign-to-text'].includes(screen);
  const showNav = !['sign-to-text','text-to-sign','conversation'].includes(screen);

  return (
    <div style={{
      minHeight: '100vh',
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      padding: '40px 20px 60px',
      background: 'radial-gradient(ellipse at top, #EAE3D4 0%, #D4CDBD 70%, #C4BBA5 100%)',
      fontSize: `${fs * 100}%`,
    }}>
      <MdStyles/>

      {/* Título */}
      <div style={{ marginBottom: 28, textAlign: 'center' }}>
        <div style={{
          display: 'inline-flex', alignItems: 'center', gap: 12,
          padding: '8px 16px', borderRadius: 16,
          background: 'rgba(255,255,255,0.6)', backdropFilter: 'blur(10px)',
          border: '1px solid rgba(0,0,0,0.06)',
        }}>
          <div style={{
            width: 36, height: 36, borderRadius: 12,
            background: 'linear-gradient(135deg, #1A56DB, #4E86DF)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <MdIcon name="hand" size={19} color="#fff" stroke={2.6}/>
          </div>
          <div style={{ textAlign: 'left' }}>
            <div style={{ fontSize: 18, fontWeight: 600, color: '#1C1B1F', letterSpacing: -0.1, lineHeight: 1 }}>Seña</div>
            <div style={{ fontSize: 10, fontWeight: 500, color: '#49454F', letterSpacing: 1.5, marginTop: 2 }}>
              ANDROID · MATERIAL 3
            </div>
          </div>
        </div>
      </div>

      <div style={{
        borderRadius: 26, overflow: 'hidden',
        boxShadow: '0 40px 80px rgba(0,0,0,0.22), 0 0 0 1px rgba(0,0,0,0.08)',
      }}>
        <AndroidDevice dark={themeKey === 'dark'}>
          <div style={{
            height: '100%', display: 'flex', flexDirection: 'column',
            position: 'relative', background: theme.bg,
          }}>
            {renderScreen()}
            {showNav && <MdNavBar theme={theme} active={navTabFor(screen)} onNav={goTo}/>}
          </div>
        </AndroidDevice>
      </div>

      {/* Mapa de pantallas */}
      <div style={{
        marginTop: 28, display: 'flex', flexWrap: 'wrap', gap: 8, justifyContent: 'center',
        maxWidth: 620,
      }}>
        {[
          ['home', 'Inicio'],
          ['sign-to-text', 'Seña → Texto'],
          ['text-to-sign', 'Texto → Seña'],
          ['conversation', 'Conversación'],
          ['dict', 'Diccionario'],
          ['learn', 'Aprender'],
          ['history', 'Historial'],
          ['settings', 'Ajustes'],
        ].map(([k, label], i) => (
          <button key={k} onClick={() => goTo(k)} style={{
            padding: '8px 14px', borderRadius: 10,
            background: screen === k ? '#1C1B1F' : 'rgba(255,255,255,0.7)',
            color: screen === k ? '#fff' : '#1C1B1F',
            border: '1px solid rgba(0,0,0,0.08)',
            fontSize: 12, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit',
            backdropFilter: 'blur(8px)', letterSpacing: 0.1,
          }}>
            <span style={{ opacity: 0.5, marginRight: 6 }}>{i + 1}</span>
            {label}
          </button>
        ))}
      </div>

      {/* Link iOS */}
      <div style={{ marginTop: 12, fontSize: 12, color: '#49454F' }}>
        ¿Buscas la versión iOS? <a href="Seña LSC.html" style={{ color: '#1A56DB', fontWeight: 600, textDecoration: 'none' }}>Abrir Seña iOS</a>
      </div>

      {tweaksEnabled && showTweaks && (
        <div style={{
          position: 'fixed', bottom: 20, right: 20, zIndex: 100,
          width: 290, background: '#fff', borderRadius: 20,
          boxShadow: '0 20px 50px rgba(0,0,0,0.25)', border: '1px solid rgba(0,0,0,0.08)',
          overflow: 'hidden',
        }}>
          <div style={{
            padding: '14px 18px', display: 'flex', justifyContent: 'space-between', alignItems: 'center',
            borderBottom: '1px solid rgba(0,0,0,0.06)',
          }}>
            <div style={{ fontSize: 15, fontWeight: 600, color: '#1C1B1F' }}>Tweaks</div>
            <button onClick={() => setShowTweaks(false)} style={{
              background: 'none', border: 'none', cursor: 'pointer', padding: 4,
            }}><MdIcon name="x" size={16} color="#49454F"/></button>
          </div>
          <div style={{ padding: 16, display: 'grid', gap: 14 }}>
            <div>
              <div style={{ fontSize: 11, fontWeight: 600, color: '#49454F', letterSpacing: 0.6, marginBottom: 6 }}>TEMA</div>
              <div style={{ display: 'flex', gap: 6 }}>
                {['default', 'daltonic', 'dark'].map(k => (
                  <button key={k} onClick={() => { setThemeKey(k); persist('theme', k); }} style={{
                    flex: 1, padding: '10px', borderRadius: 12,
                    background: themeKey === k ? '#1A56DB' : '#ECE6DD',
                    color: themeKey === k ? '#fff' : '#1C1B1F',
                    border: 'none', cursor: 'pointer', fontFamily: 'inherit',
                    fontSize: 11, fontWeight: 600,
                  }}>{SENA_M3_THEMES[k].name}</button>
                ))}
              </div>
            </div>
            <div>
              <div style={{ fontSize: 11, fontWeight: 600, color: '#49454F', letterSpacing: 0.6, marginBottom: 6 }}>TAMAÑO DE TEXTO</div>
              <div style={{ display: 'flex', gap: 6 }}>
                {[['normal','Normal'],['large','Grande'],['xlarge','XL']].map(([k, label]) => (
                  <button key={k} onClick={() => { setFontScale(k); persist('fontScale', k); }} style={{
                    flex: 1, padding: '10px', borderRadius: 12,
                    background: fontScale === k ? '#1A56DB' : '#ECE6DD',
                    color: fontScale === k ? '#fff' : '#1C1B1F',
                    border: 'none', cursor: 'pointer', fontFamily: 'inherit',
                    fontSize: 11, fontWeight: 600,
                  }}>{label}</button>
                ))}
              </div>
            </div>
            <label style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 13, fontWeight: 500, color: '#1C1B1F' }}>
              Modo sin conexión
              <input type="checkbox" checked={offline} onChange={e => { setOffline(e.target.checked); persist('offline', e.target.checked); }}/>
            </label>
            <label style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 13, fontWeight: 500, color: '#1C1B1F' }}>
              Vibración
              <input type="checkbox" checked={vibration} onChange={e => { setVibration(e.target.checked); persist('vibration', e.target.checked); }}/>
            </label>
          </div>
        </div>
      )}
    </div>
  );
}

const waitForComponents = () => {
  if (window.AndroidDevice && window.MdHomeScreen && window.MdSettingsScreen) {
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  } else {
    setTimeout(waitForComponents, 50);
  }
};
waitForComponents();
</script>


</body></html>
