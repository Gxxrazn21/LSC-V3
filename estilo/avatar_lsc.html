<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar LSC 3D — Texto a Lengua de Señas Colombiana</title>
    <meta name="description" content="Escribe texto en español y un avatar 3D animado traduce a Lengua de Señas Colombiana (LSC) en tiempo real.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════════════ */
        /* DESIGN SYSTEM — AVATAR LSC 3D                             */
        /* ═══════════════════════════════════════════════════════════ */
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: rgba(17, 24, 39, 0.75);
            --bg-glass: rgba(30, 41, 59, 0.55);
            --border-glass: rgba(99, 102, 241, 0.25);
            --border-glow: rgba(99, 102, 241, 0.5);
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-teal: #06b6d4;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --gradient-hero: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
            --gradient-dark: linear-gradient(180deg, #0a0e1a 0%, #1e1b4b 50%, #0a0e1a 100%);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px rgba(99, 102, 241, 0.15);
            --radius-lg: 16px;
            --radius-xl: 24px;
            --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ─── Background Ambient Effect ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 30%, rgba(99, 102, 241, 0.08), transparent),
                radial-gradient(ellipse 60% 80% at 80% 70%, rgba(6, 182, 212, 0.06), transparent),
                radial-gradient(ellipse 50% 50% at 50% 50%, rgba(139, 92, 246, 0.04), transparent);
            pointer-events: none;
            z-index: 0;
        }

        /* ─── Main Layout ─── */
        .app-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            grid-template-rows: auto 1fr;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ─── Header ─── */
        .header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-brand .logo-icon {
            width: 42px;
            height: 42px;
            background: var(--gradient-hero);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .header-brand h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            background: var(--gradient-hero);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-brand .subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--accent-emerald);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-emerald);
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--accent-emerald); }
            50% { opacity: 0.5; box-shadow: 0 0 12px var(--accent-emerald); }
        }

        /* ─── 3D Viewport ─── */
        .viewport-container {
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Input bar overlaid on viewport */
        .input-bar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 48px);
            max-width: 680px;
            display: flex;
            gap: 12px;
            padding: 8px;
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            box-shadow: var(--shadow-xl), var(--shadow-glow);
            transition: var(--transition-smooth);
        }

        .input-bar:focus-within {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-xl), 0 0 40px rgba(99, 102, 241, 0.25);
        }

        #input-texto {
            flex: 1;
            padding: 14px 20px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid transparent;
            border-radius: 14px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: var(--transition-smooth);
        }

        #input-texto::placeholder {
            color: var(--text-muted);
        }

        #input-texto:focus {
            border-color: rgba(99, 102, 241, 0.3);
            background: rgba(15, 23, 42, 0.8);
        }

        .btn-traducir {
            padding: 14px 28px;
            background: var(--gradient-hero);
            color: white;
            border: none;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition-smooth);
            white-space: nowrap;
        }

        .btn-traducir:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-traducir:active {
            transform: translateY(0);
        }

        .btn-traducir:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-traducir .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .btn-traducir.loading .spinner { display: block; }
        .btn-traducir.loading .btn-text { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Playback controls overlay */
        .playback-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .playback-controls.visible {
            opacity: 1;
            pointer-events: all;
        }

        .playback-btn {
            width: 42px;
            height: 42px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .playback-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--accent-primary);
        }

        .speed-badge {
            padding: 8px 14px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        /* Progress bar */
        .progress-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(99, 102, 241, 0.1);
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--gradient-hero);
            width: 0%;
            transition: width 0.1s linear;
            border-radius: 0 2px 2px 0;
        }

        /* Current sign overlay */
        .current-sign-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .current-sign-overlay.visible { opacity: 1; }

        .current-sign-name {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: var(--gradient-hero);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }

        .current-sign-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            max-width: 400px;
            margin-top: 4px;
        }

        /* ─── Sidebar ─── */
        .sidebar {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-glass);
        }

        .sidebar-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .sidebar-header p {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .sidebar-content::-webkit-scrollbar { width: 4px; }
        .sidebar-content::-webkit-scrollbar-track { background: transparent; }
        .sidebar-content::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 4px;
        }

        /* Sign sequence cards */
        .sign-card {
            padding: 14px 16px;
            background: var(--bg-card);
            border: 1px solid rgba(99, 102, 241, 0.1);
            border-radius: var(--radius-lg);
            margin-bottom: 10px;
            cursor: pointer;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .sign-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--text-muted);
            border-radius: 0 3px 3px 0;
            transition: var(--transition-smooth);
        }

        .sign-card.active {
            border-color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.08);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
        }

        .sign-card.active::before {
            background: var(--gradient-hero);
            width: 4px;
        }

        .sign-card.completed::before {
            background: var(--accent-emerald);
        }

        .sign-card:hover:not(.active) {
            border-color: rgba(99, 102, 241, 0.2);
            transform: translateX(4px);
        }

        .sign-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .sign-card-index {
            width: 26px;
            height: 26px;
            background: rgba(99, 102, 241, 0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .sign-card.active .sign-card-index {
            background: var(--accent-primary);
            color: white;
        }

        .sign-card.completed .sign-card-index {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-emerald);
        }

        .sign-card-glosa {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .sign-card-cuadrante {
            font-size: 0.68rem;
            color: var(--text-muted);
            padding: 2px 8px;
            background: rgba(100, 116, 139, 0.15);
            border-radius: 6px;
        }

        .sign-card-desc {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.45;
        }

        .sign-card-fingers {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .finger-dot {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .finger-dot.extended {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-emerald);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .finger-dot.closed {
            background: rgba(244, 63, 94, 0.15);
            color: var(--accent-rose);
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 32px;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .empty-state h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 0.82rem;
            color: var(--text-muted);
            max-width: 280px;
            line-height: 1.5;
        }

        /* Quick phrases */
        .quick-phrases {
            padding: 16px 24px;
            border-top: 1px solid var(--border-glass);
        }

        .quick-phrases-title {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .quick-phrases-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .quick-phrase-btn {
            padding: 6px 12px;
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-family: 'Inter', sans-serif;
        }

        .quick-phrase-btn:hover {
            background: rgba(99, 102, 241, 0.18);
            color: var(--text-primary);
            border-color: var(--accent-primary);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 50vh auto;
            }
            .sidebar { border-left: none; border-top: 1px solid var(--border-glass); }
            .input-bar { width: calc(100% - 24px); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-brand">
                <div class="logo-icon">🤟</div>
                <div>
                    <h1>Avatar LSC 3D</h1>
                    <span class="subtitle">Texto → Lengua de Señas Colombiana</span>
                </div>
            </div>
            <div class="header-status">
                <div class="status-dot"></div>
                <span id="status-text">Motor 3D Activo</span>
            </div>
        </header>

        <!-- 3D Viewport -->
        <div class="viewport-container">
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
            <canvas id="canvas3d"></canvas>

            <!-- Current sign display -->
            <div class="current-sign-overlay" id="current-sign-overlay">
                <div class="current-sign-name" id="current-sign-name"></div>
                <div class="current-sign-desc" id="current-sign-desc"></div>
            </div>

            <!-- Playback controls -->
            <div class="playback-controls" id="playback-controls">
                <button class="playback-btn" id="btn-replay" title="Repetir">🔄</button>
                <button class="playback-btn" id="btn-pause" title="Pausar/Resumir">⏸️</button>
                <button class="playback-btn" id="btn-slower" title="Más lento">🐢</button>
                <button class="playback-btn" id="btn-faster" title="Más rápido">🐇</button>
                <div class="speed-badge" id="speed-badge">1.0×</div>
            </div>

            <!-- Text input bar -->
            <div class="input-bar">
                <input
                    type="text"
                    id="input-texto"
                    placeholder="Escribe una frase en español... (ej: Hola buenas tardes)"
                    autocomplete="off"
                >
                <button class="btn-traducir" id="btn-traducir">
                    <span class="btn-text">✨ Animar</span>
                    <div class="spinner"></div>
                </button>
            </div>
        </div>

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Secuencia de Señas</h2>
                <p id="sidebar-subtitle">Escribe texto para ver la traducción</p>
            </div>
            <div class="sidebar-content" id="sidebar-content">
                <div class="empty-state">
                    <div class="icon">🤲</div>
                    <h3>Sin traducción activa</h3>
                    <p>Ingresa una frase en español y el avatar la traducirá a Lengua de Señas Colombiana en 3D.</p>
                </div>
            </div>
            <div class="quick-phrases">
                <div class="quick-phrases-title">Frases Rápidas</div>
                <div class="quick-phrases-grid">
                    <button class="quick-phrase-btn" data-text="Hola buenas tardes">Hola buenas tardes</button>
                    <button class="quick-phrase-btn" data-text="Mi nombre es Juan">Mi nombre es Juan</button>
                    <button class="quick-phrase-btn" data-text="¿Dónde queda el baño?">¿Dónde está el baño?</button>
                    <button class="quick-phrase-btn" data-text="Necesito ayuda">Necesito ayuda</button>
                    <button class="quick-phrase-btn" data-text="Yo te apoyo">Yo te apoyo</button>
                    <button class="quick-phrase-btn" data-text="Gracias">Gracias</button>
                    <button class="quick-phrase-btn" data-text="Bienvenido">Bienvenido</button>
                </div>
            </div>
        </aside>
    </div>

    <!-- Three.js via CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
    }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ═══════════════════════════════════════════════════════════
    // CONFIGURACIÓN DE LA ESCENA THREE.JS
    // ═══════════════════════════════════════════════════════════
    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0e1a, 0.08);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0.8, 1.2, 2.2);
    camera.lookAt(0, 0.8, 0);

    // Controls
    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 0.8, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI * 0.85;
    controls.minDistance = 1;
    controls.maxDistance = 5;

    // ─── Lighting ───
    const ambientLight = new THREE.AmbientLight(0x4466aa, 0.5);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
    mainLight.position.set(3, 5, 4);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.set(2048, 2048);
    mainLight.shadow.camera.near = 0.5;
    mainLight.shadow.camera.far = 20;
    mainLight.shadow.camera.left = -4;
    mainLight.shadow.camera.right = 4;
    mainLight.shadow.camera.top = 4;
    mainLight.shadow.camera.bottom = -4;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0x6366f1, 0.4);
    fillLight.position.set(-3, 2, -2);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(0x06b6d4, 0.6, 10);
    rimLight.position.set(-2, 3, -3);
    scene.add(rimLight);

    // ─── Environment (ground plane) ───
    const groundGeo = new THREE.CircleGeometry(3, 64);
    const groundMat = new THREE.MeshStandardMaterial({
        color: 0x111827,
        roughness: 0.9,
        metalness: 0.1,
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid helper (subtle)
    const gridHelper = new THREE.GridHelper(6, 30, 0x1e3a5f, 0x0f1f33);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    // ═══════════════════════════════════════════════════════════
    // AVATAR PROCEDURAL — TORSO + CABEZA + BRAZO + MANO
    // ═══════════════════════════════════════════════════════════

    // Materials
    const skinMat = new THREE.MeshStandardMaterial({
        color: 0xd4a574,
        roughness: 0.65,
        metalness: 0.05,
    });

    const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x2d3748,
        roughness: 0.7,
        metalness: 0.2,
    });

    const accentMat = new THREE.MeshStandardMaterial({
        color: 0x6366f1,
        roughness: 0.3,
        metalness: 0.6,
        emissive: 0x6366f1,
        emissiveIntensity: 0.1,
    });

    const jointMat = new THREE.MeshStandardMaterial({
        color: 0x06b6d4,
        roughness: 0.3,
        metalness: 0.4,
        emissive: 0x06b6d4,
        emissiveIntensity: 0.15,
    });

    const avatarGroup = new THREE.Group();
    scene.add(avatarGroup);

    // ── Torso (rounded box approximation) ──
    const torsoGeo = new THREE.CylinderGeometry(0.22, 0.18, 0.6, 16);
    const torso = new THREE.Mesh(torsoGeo, bodyMat);
    torso.position.set(0, 0.55, 0);
    torso.castShadow = true;
    avatarGroup.add(torso);

    // ── Shoulders ──
    const shoulderGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.55, 8);
    const shoulders = new THREE.Mesh(shoulderGeo, bodyMat);
    shoulders.rotation.z = Math.PI / 2;
    shoulders.position.set(0, 0.82, 0);
    avatarGroup.add(shoulders);

    // ── Neck ──
    const neckGeo = new THREE.CylinderGeometry(0.06, 0.07, 0.1, 12);
    const neck = new THREE.Mesh(neckGeo, skinMat);
    neck.position.set(0, 0.92, 0);
    avatarGroup.add(neck);

    // ── Head ──
    const headGeo = new THREE.SphereGeometry(0.13, 24, 18);
    const head = new THREE.Mesh(headGeo, skinMat);
    head.position.set(0, 1.1, 0);
    head.castShadow = true;
    avatarGroup.add(head);

    // Eyes
    const eyeGeo = new THREE.SphereGeometry(0.018, 12, 8);
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.2, metalness: 0.8 });

    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.045, 1.12, 0.11);
    avatarGroup.add(eyeL);

    const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
    eyeR.position.set(0.045, 1.12, 0.11);
    avatarGroup.add(eyeR);

    // ── Left arm (static, resting) ──
    const upperArmGeoL = new THREE.CylinderGeometry(0.035, 0.03, 0.3, 8);
    const upperArmL = new THREE.Mesh(upperArmGeoL, skinMat);
    upperArmL.position.set(-0.3, 0.65, 0);
    upperArmL.rotation.z = 0.15;
    avatarGroup.add(upperArmL);

    const forearmGeoL = new THREE.CylinderGeometry(0.028, 0.025, 0.28, 8);
    const forearmL = new THREE.Mesh(forearmGeoL, skinMat);
    forearmL.position.set(-0.33, 0.38, 0.02);
    forearmL.rotation.z = 0.1;
    avatarGroup.add(forearmL);

    // ── Right arm (animated) ──
    const rightArmGroup = new THREE.Group();
    rightArmGroup.position.set(0.28, 0.82, 0); // Shoulder position
    avatarGroup.add(rightArmGroup);

    const upperArmGeoR = new THREE.CylinderGeometry(0.035, 0.03, 0.3, 8);
    const upperArmR = new THREE.Mesh(upperArmGeoR, skinMat);
    upperArmR.position.set(0.02, -0.15, 0);
    upperArmR.castShadow = true;
    rightArmGroup.add(upperArmR);

    // Elbow joint
    const elbowGeo = new THREE.SphereGeometry(0.032, 12, 8);
    const elbow = new THREE.Mesh(elbowGeo, skinMat);
    elbow.position.set(0.02, -0.3, 0);
    rightArmGroup.add(elbow);

    const forearmGroup = new THREE.Group();
    forearmGroup.position.set(0.02, -0.3, 0);
    rightArmGroup.add(forearmGroup);

    const forearmGeoR = new THREE.CylinderGeometry(0.028, 0.025, 0.28, 8);
    const forearmR = new THREE.Mesh(forearmGeoR, skinMat);
    forearmR.position.set(0, -0.14, 0.04);
    forearmR.rotation.x = 0.3;
    forearmR.castShadow = true;
    forearmGroup.add(forearmR);

    // ── Hand (21 joints + bones) ──
    const handGroup = new THREE.Group();
    handGroup.position.set(0, -0.30, 0.12);
    forearmGroup.add(handGroup);

    // Create hand joints and bones
    const handJoints = []; // Array of 21 THREE.Mesh objects
    const handBones = [];  // Array of connecting cylinders

    const jointGeo = new THREE.SphereGeometry(0.012, 10, 8);
    const tipGeo = new THREE.SphereGeometry(0.010, 10, 8);

    // Create 21 joints
    for (let i = 0; i < 21; i++) {
        const isTip = [4, 8, 12, 16, 20].includes(i);
        const isWrist = i === 0;
        const geo = isTip ? tipGeo : jointGeo;
        const mat = isWrist ? accentMat.clone() : (isTip ? jointMat.clone() : skinMat.clone());
        const joint = new THREE.Mesh(geo, mat);
        joint.castShadow = true;
        handGroup.add(joint);
        handJoints.push(joint);
    }

    // Bone connections (parent → child)
    const BONE_CONNECTIONS = [
        [0, 1], [1, 2], [2, 3], [3, 4],       // Thumb
        [0, 5], [5, 6], [6, 7], [7, 8],       // Index
        [0, 9], [9, 10], [10, 11], [11, 12],  // Middle
        [0, 13], [13, 14], [14, 15], [15, 16], // Ring
        [0, 17], [17, 18], [18, 19], [19, 20], // Pinky
        [5, 9], [9, 13], [13, 17],              // Palm connections
    ];

    const boneGeo = new THREE.CylinderGeometry(0.005, 0.004, 1, 6);
    const boneMat = new THREE.MeshStandardMaterial({
        color: 0x94a3b8,
        roughness: 0.5,
        metalness: 0.3,
        transparent: true,
        opacity: 0.7,
    });

    for (const [a, b] of BONE_CONNECTIONS) {
        const bone = new THREE.Mesh(boneGeo.clone(), boneMat.clone());
        bone.castShadow = true;
        handGroup.add(bone);
        handBones.push({ mesh: bone, from: a, to: b });
    }

    // ═══════════════════════════════════════════════════════════
    // DEFAULT HAND POSE (rest position)
    // ═══════════════════════════════════════════════════════════
    const DEFAULT_LANDMARKS = [
        [0, 0, 0],
        [-0.04, 0.02, 0.01], [-0.07, 0.04, 0.02], [-0.09, 0.06, 0.02], [-0.10, 0.08, 0.02],
        [-0.02, 0.08, 0.0], [-0.02, 0.12, -0.01], [-0.02, 0.14, -0.02], [-0.02, 0.16, -0.02],
        [0.0, 0.08, 0.0], [0.0, 0.13, -0.01], [0.0, 0.15, -0.02], [0.0, 0.17, -0.02],
        [0.02, 0.08, 0.0], [0.02, 0.12, -0.01], [0.02, 0.14, -0.02], [0.02, 0.16, -0.02],
        [0.04, 0.07, 0.01], [0.04, 0.10, -0.01], [0.04, 0.12, -0.02], [0.04, 0.13, -0.02],
    ];

    // Scale factor for hand landmarks
    const HAND_SCALE = 2.5;

    function setHandPose(landmarks, smooth = false) {
        if (!landmarks || landmarks.length < 21) return;

        for (let i = 0; i < 21; i++) {
            const [x, y, z] = landmarks[i];
            const targetPos = new THREE.Vector3(
                x * HAND_SCALE,
                y * HAND_SCALE,
                z * HAND_SCALE
            );

            if (smooth) {
                handJoints[i].userData.targetPosition = targetPos;
            } else {
                handJoints[i].position.copy(targetPos);
            }
        }

        updateBones();
    }

    function updateBones() {
        for (const bone of handBones) {
            const posA = handJoints[bone.from].position;
            const posB = handJoints[bone.to].position;

            const midpoint = new THREE.Vector3().addVectors(posA, posB).multiplyScalar(0.5);
            bone.mesh.position.copy(midpoint);

            const distance = posA.distanceTo(posB);
            bone.mesh.scale.set(1, distance, 1);

            const direction = new THREE.Vector3().subVectors(posB, posA).normalize();
            const axis = new THREE.Vector3(0, 1, 0);
            const quaternion = new THREE.Quaternion().setFromUnitVectors(axis, direction);
            bone.mesh.quaternion.copy(quaternion);
        }
    }

    // Set initial pose
    setHandPose(DEFAULT_LANDMARKS);

    // ═══════════════════════════════════════════════════════════
    // CUADRANTE POSITIONS (where the arm moves for each sign)
    // ═══════════════════════════════════════════════════════════
    const CUADRANTE_TARGETS = {
        'CABEZA_ROSTRO':    { armRotX: -0.8, armRotZ: -0.3, forearmRotX: -0.6 },
        'CUELLO_GARGANTA':  { armRotX: -0.5, armRotZ: -0.2, forearmRotX: -0.3 },
        'PECHO_TORSO':      { armRotX: -0.2, armRotZ: -0.15, forearmRotX: 0.1 },
        'ESPACIO_CENTRAL':  { armRotX: -0.4, armRotZ: -0.4, forearmRotX: 0.3 },
        'ESPACIO_LATERAL':  { armRotX: -0.1, armRotZ: -0.5, forearmRotX: 0.2 },
        'REPOSO':           { armRotX: 0.1, armRotZ: -0.1, forearmRotX: 0.0 },
    };

    let currentArmTarget = CUADRANTE_TARGETS['REPOSO'];

    function moveArmToCuadrante(cuadrante) {
        currentArmTarget = CUADRANTE_TARGETS[cuadrante] || CUADRANTE_TARGETS['ESPACIO_LATERAL'];
    }

    // ═══════════════════════════════════════════════════════════
    // ANIMATION STATE MACHINE
    // ═══════════════════════════════════════════════════════════
    let animationData = null;
    let currentSignIndex = -1;
    let animationStartTime = 0;
    let isPlaying = false;
    let isPaused = false;
    let speedMultiplier = 1.0;

    // Interpolation state
    let prevLandmarks = DEFAULT_LANDMARKS.map(p => [...p]);
    let targetLandmarks = DEFAULT_LANDMARKS.map(p => [...p]);
    let interpolationProgress = 0;

    function startAnimation(data) {
        animationData = data;
        currentSignIndex = -1;
        animationStartTime = performance.now();
        isPlaying = true;
        isPaused = false;
        interpolationProgress = 0;
        prevLandmarks = DEFAULT_LANDMARKS.map(p => [...p]);
        advanceToNextSign();
        document.getElementById('playback-controls').classList.add('visible');
    }

    function advanceToNextSign() {
        if (!animationData) return;

        currentSignIndex++;
        if (currentSignIndex >= animationData.secuencia.length) {
            // Animation complete
            finishAnimation();
            return;
        }

        const sign = animationData.secuencia[currentSignIndex];

        // Store previous landmarks for interpolation
        prevLandmarks = targetLandmarks.map(p => [...p]);
        targetLandmarks = sign.landmarks_3d.map(p => [...p]);
        interpolationProgress = 0;

        // Move arm to cuadrante
        moveArmToCuadrante(sign.cuadrante);

        // Update UI
        updateCurrentSignOverlay(sign);
        updateSidebarActive(currentSignIndex);

        // Schedule next sign
        const duration = sign.duracion_ms / speedMultiplier;
        const pause = (sign.pausa_despues_ms || 400) / speedMultiplier;
        setTimeout(() => {
            if (isPlaying && !isPaused) {
                advanceToNextSign();
            }
        }, duration + pause);
    }

    function finishAnimation() {
        isPlaying = false;
        // Return to rest
        prevLandmarks = targetLandmarks.map(p => [...p]);
        targetLandmarks = DEFAULT_LANDMARKS.map(p => [...p]);
        interpolationProgress = 0;
        moveArmToCuadrante('REPOSO');
        document.getElementById('current-sign-overlay').classList.remove('visible');

        // Mark all sidebar cards as completed
        document.querySelectorAll('.sign-card').forEach(card => {
            card.classList.remove('active');
            card.classList.add('completed');
        });
    }

    // ═══════════════════════════════════════════════════════════
    // RENDER LOOP
    // ═══════════════════════════════════════════════════════════
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        // Smooth arm movement
        const lerpSpeed = 3.0 * dt;
        rightArmGroup.rotation.x += (currentArmTarget.armRotX - rightArmGroup.rotation.x) * lerpSpeed * 2;
        rightArmGroup.rotation.z += (currentArmTarget.armRotZ - rightArmGroup.rotation.z) * lerpSpeed * 2;
        forearmGroup.rotation.x += (currentArmTarget.forearmRotX - forearmGroup.rotation.x) * lerpSpeed * 2;

        // Smooth hand interpolation
        if (isPlaying || interpolationProgress < 1) {
            interpolationProgress = Math.min(1, interpolationProgress + dt * 3.0 * speedMultiplier);
            const t = easeInOutCubic(interpolationProgress);

            for (let i = 0; i < 21; i++) {
                const px = prevLandmarks[i][0] + (targetLandmarks[i][0] - prevLandmarks[i][0]) * t;
                const py = prevLandmarks[i][1] + (targetLandmarks[i][1] - prevLandmarks[i][1]) * t;
                const pz = prevLandmarks[i][2] + (targetLandmarks[i][2] - prevLandmarks[i][2]) * t;
                handJoints[i].position.set(px * HAND_SCALE, py * HAND_SCALE, pz * HAND_SCALE);
            }
            updateBones();
        }

        // Subtle idle animation for head
        const time = clock.elapsedTime;
        head.rotation.y = Math.sin(time * 0.5) * 0.05;
        head.rotation.z = Math.sin(time * 0.3) * 0.02;

        // Breathing effect
        torso.scale.y = 1 + Math.sin(time * 1.2) * 0.01;

        // Joint glow pulse when playing
        if (isPlaying) {
            const pulse = Math.sin(time * 4) * 0.5 + 0.5;
            for (const joint of handJoints) {
                if (joint.material.emissive) {
                    joint.material.emissiveIntensity = 0.1 + pulse * 0.15;
                }
            }
        }

        // Update progress bar
        if (animationData && isPlaying) {
            const totalDuration = animationData.duracion_total_ms / speedMultiplier;
            const elapsed = performance.now() - animationStartTime;
            const progress = Math.min(100, (elapsed / totalDuration) * 100);
            document.getElementById('progress-bar').style.width = progress + '%';
        }

        controls.update();
        renderer.render(scene, camera);
    }

    function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // Handle resize
    function onResize() {
        const container = canvas.parentElement;
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    }

    window.addEventListener('resize', onResize);
    onResize();
    animate();

    // ═══════════════════════════════════════════════════════════
    // UI INTERACTIONS
    // ═══════════════════════════════════════════════════════════
    const inputTexto = document.getElementById('input-texto');
    const btnTraducir = document.getElementById('btn-traducir');
    const sidebarContent = document.getElementById('sidebar-content');

    async function traducirYAnimar() {
        const texto = inputTexto.value.trim();
        if (!texto) return;

        btnTraducir.classList.add('loading');
        btnTraducir.disabled = true;

        try {
            const response = await fetch('/api/texto_a_lsc_3d', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ texto }),
            });

            if (!response.ok) throw new Error('Error del servidor');

            const data = await response.json();

            if (!data.animacion || data.animacion.total_senas === 0) {
                showError('No se encontraron señas para este texto.');
                return;
            }

            // Render sidebar cards
            renderSidebarCards(data.animacion.secuencia);
            document.getElementById('sidebar-subtitle').textContent =
                `${data.animacion.total_senas} señas · ${(data.animacion.duracion_total_ms / 1000).toFixed(1)}s`;

            // Reset progress bar
            document.getElementById('progress-bar').style.width = '0%';

            // Start 3D animation
            animationStartTime = performance.now();
            startAnimation(data.animacion);

        } catch (err) {
            showError('Error de conexión con el servidor.');
            console.error(err);
        } finally {
            btnTraducir.classList.remove('loading');
            btnTraducir.disabled = false;
        }
    }

    function showError(msg) {
        sidebarContent.innerHTML = `
            <div class="empty-state">
                <div class="icon">⚠️</div>
                <h3>Error</h3>
                <p>${msg}</p>
            </div>
        `;
    }

    function renderSidebarCards(secuencia) {
        const fingerLabels = ['P', 'I', 'M', 'A', 'Ñ'];
        sidebarContent.innerHTML = secuencia.map((sign, idx) => {
            const dedos = sign.dedos_esperados || sign.dedos_extension || [0,0,0,0,0];
            const fingersHTML = dedos.map((d, fi) => {
                const isExt = (typeof d === 'number' && d >= 0.5) || d === 1;
                return `<div class="finger-dot ${isExt ? 'extended' : 'closed'}">${fingerLabels[fi]}</div>`;
            }).join('');

            const cuadranteLabel = (sign.cuadrante || '').replace(/_/g, ' ').toLowerCase();

            return `
                <div class="sign-card" data-index="${idx}" id="sign-card-${idx}">
                    <div class="sign-card-header">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <div class="sign-card-index">${idx + 1}</div>
                            <span class="sign-card-glosa">${sign.glosa || sign.nombre}</span>
                        </div>
                        <span class="sign-card-cuadrante">${cuadranteLabel}</span>
                    </div>
                    <div class="sign-card-desc">${sign.descripcion || ''}</div>
                    <div class="sign-card-fingers">${fingersHTML}</div>
                </div>
            `;
        }).join('');

        // Click to jump to sign
        sidebarContent.querySelectorAll('.sign-card').forEach(card => {
            card.addEventListener('click', () => {
                const idx = parseInt(card.dataset.index);
                if (animationData && idx < animationData.secuencia.length) {
                    jumpToSign(idx);
                }
            });
        });
    }

    function jumpToSign(idx) {
        if (!animationData) return;
        currentSignIndex = idx - 1; // Will be incremented in advanceToNextSign
        isPlaying = true;
        isPaused = false;
        advanceToNextSign();
    }

    function updateCurrentSignOverlay(sign) {
        const overlay = document.getElementById('current-sign-overlay');
        document.getElementById('current-sign-name').textContent = sign.nombre || sign.glosa;
        document.getElementById('current-sign-desc').textContent = sign.consejo || sign.descripcion || '';
        overlay.classList.add('visible');
    }

    function updateSidebarActive(idx) {
        document.querySelectorAll('.sign-card').forEach((card, i) => {
            card.classList.remove('active');
            if (i < idx) card.classList.add('completed');
            if (i === idx) {
                card.classList.add('active');
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        });
    }

    // Event listeners
    btnTraducir.addEventListener('click', traducirYAnimar);
    inputTexto.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') traducirYAnimar();
    });

    // Quick phrases
    document.querySelectorAll('.quick-phrase-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            inputTexto.value = btn.dataset.text;
            traducirYAnimar();
        });
    });

    // Playback controls
    document.getElementById('btn-replay').addEventListener('click', () => {
        if (animationData) {
            animationStartTime = performance.now();
            startAnimation(animationData);
        }
    });

    document.getElementById('btn-pause').addEventListener('click', () => {
        isPaused = !isPaused;
        document.getElementById('btn-pause').textContent = isPaused ? '▶️' : '⏸️';
        if (!isPaused && isPlaying) advanceToNextSign();
    });

    document.getElementById('btn-slower').addEventListener('click', () => {
        speedMultiplier = Math.max(0.25, speedMultiplier - 0.25);
        document.getElementById('speed-badge').textContent = speedMultiplier.toFixed(2) + '×';
    });

    document.getElementById('btn-faster').addEventListener('click', () => {
        speedMultiplier = Math.min(3.0, speedMultiplier + 0.25);
        document.getElementById('speed-badge').textContent = speedMultiplier.toFixed(2) + '×';
    });

    // Check server status
    async function checkStatus() {
        try {
            const res = await fetch('/api/exportador_3d/estado');
            const data = await res.json();
            if (data.inicializado) {
                document.getElementById('status-text').textContent =
                    `Motor 3D Activo · ${data.total_senas_con_3d} señas`;
            } else {
                document.getElementById('status-text').textContent = 'Motor 3D No Inicializado';
                document.querySelector('.status-dot').style.background = 'var(--accent-amber)';
            }
        } catch {
            document.getElementById('status-text').textContent = 'Sin conexión al servidor';
            document.querySelector('.status-dot').style.background = 'var(--accent-rose)';
        }
    }

    checkStatus();
    </script>
</body>
</html>
